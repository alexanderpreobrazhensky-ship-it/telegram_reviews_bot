<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Отзывы — Автоцентр Лира</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(180deg,#050b17,#0b1b3a);
color:white;
text-align:center;
padding:30px;
}

.logo{
width:120px;
margin:auto;
display:block;
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-12px)}
100%{transform:translateY(0)}
}

h1{
margin-top:20px;
font-size:30px;
}

.subtitle{
opacity:0.7;
margin-bottom:30px;
}

.buttons{
max-width:360px;
margin:auto;
display:flex;
flex-direction:column;
gap:16px;
}

.btn{
padding:18px;
border-radius:14px;
font-size:18px;
border:none;
cursor:pointer;
font-weight:bold;
}

.yandex{
background:#ffd400;
color:black;
}

.gis{
background:#28c76f;
color:white;
}

.tg{
background:#2AABEE;
color:white;
}

.stats{
margin-top:50px;
max-width:600px;
margin-left:auto;
margin-right:auto;
}

.cards{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
margin-bottom:20px;
}

.card{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:12px;
width:150px;
}

.card-title{
font-size:14px;
opacity:0.7;
}

.card-value{
font-size:26px;
margin-top:6px;
}

canvas{
background:rgba(255,255,255,0.05);
padding:10px;
border-radius:12px;
margin-top:15px;
}

</style>
</head>

<body>

<img src="logo.png" class="logo">

<h1>Будем рады вашему отзыву</h1>

<div class="subtitle">
Выберите площадку
</div>

<div class="buttons">

<button class="btn yandex" onclick="goYandex()">
Оставить отзыв в Яндекс
</button>

<button class="btn gis" onclick="go2gis()">
Оставить отзыв в 2ГИС
</button>

<button class="btn tg" onclick="goTelegram()">
Наш Telegram
</button>

</div>

<div class="stats">

<div class="cards">

<div class="card">
<div class="card-title">Всего переходов</div>
<div class="card-value" id="total">0</div>
</div>

<div class="card">
<div class="card-title">Сегодня</div>
<div class="card-value" id="today">0</div>
</div>

<div class="card">
<div class="card-title">7 дней</div>
<div class="card-value" id="week">0</div>
</div>

</div>

<canvas id="chart"></canvas>

</div>

<script>

const SUPABASE_URL = "https://oqgjjxsi0aofenvacetl.supabase.co"
const SUPABASE_KEY = "sb_publishable_tJ00AmXTERE9jKnHfSFpvQ_yVce_t4d"

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const yandexLink = "https://yandex.ru/maps/org/lira/1014791361/reviews/?ll=43.889574%2C56.287187&tab=reviews&z=17"
const gisLink = "https://2gis.ru/n_novgorod/firm/2674540559836449/tab/reviews?m=43.889507%2C56.287218%2F16"
const tgLink = "https://t.me/LIRA_NN"

async function track(platform){
await supabase.from("review_clicks").insert({platform:platform})
}

async function goYandex(){
track("yandex")
window.location.href = yandexLink
}

async function go2gis(){
track("2gis")
window.location.href = gisLink
}

async function goTelegram(){
track("telegram")
window.location.href = tgLink
}

async function loadStats(){

let {data} = await supabase
.from("review_clicks")
.select("*")

if(!data) return

let total = data.length

let today = new Date()
today.setHours(0,0,0,0)

let week = new Date()
week.setDate(week.getDate()-7)

let todayCount = data.filter(x => new Date(x.created_at) > today).length
let weekCount = data.filter(x => new Date(x.created_at) > week).length

document.getElementById("total").innerText = total
document.getElementById("today").innerText = todayCount
document.getElementById("week").innerText = weekCount

drawChart(data)

}

function drawChart(data){

let days = {}

for(let i=0;i<14;i++){
let d = new Date()
d.setDate(d.getDate()-i)
let key = d.toISOString().slice(0,10)
days[key] = 0
}

data.forEach(row=>{
let day = row.created_at.slice(0,10)
if(days[day] !== undefined){
days[day]++
}
})

let labels = Object.keys(days).reverse()
let values = Object.values(days).reverse()

new Chart(
document.getElementById("chart"),
{
type:"line",
data:{
labels:labels,
datasets:[{
label:"Переходы",
data:values,
fill:true,
tension:0.3
}]
}
}
)

}

loadStats()

setInterval(loadStats,30000)

</script>

</body>
</html>
