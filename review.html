<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Отзывы — Автоцентр Лира</title>
  <style>
    :root{
      --bg1:#050b17;
      --bg2:#0b1b3a;
      --text:#ffffff;
      --muted:rgba(255,255,255,.72);
      --stroke:rgba(255,255,255,.10);
      --shadow:0 18px 50px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 50% 0%, rgba(90,140,255,.22), transparent 60%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
    }
    .wrap{
      width:min(520px,100%);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--stroke);
      border-radius:24px;
      padding:28px 22px;
      box-shadow:var(--shadow);
      text-align:center;
    }
    .logo{
      width:110px;
      display:block;
      margin:0 auto 16px;
    }
    h1{
      margin:6px 0 6px;
      font-size:30px;
      line-height:1.15;
    }
    .sub{
      margin:0 0 20px;
      color:var(--muted);
      font-size:15px;
    }
    .btns{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top:14px;
    }
    a.btn{
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      padding:16px;
      border-radius:16px;
      font-size:18px;
      font-weight:800;
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 10px 22px rgba(0,0,0,.25);
      color:#111;
    }
    .yandex{background:#ffd400}
    .gis{background:#28c76f;color:#fff}
    .tg{background:#2AABEE;color:#fff}
    .note{
      margin-top:18px;
      color:rgba(255,255,255,.56);
      font-size:12.5px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.png" alt="Автоцентр Лира">

    <h1>Будем рады вашему отзыву</h1>
    <p class="sub">Выберите площадку</p>

    <div class="btns">
      <a class="btn yandex"
         href="https://yandex.ru/maps/org/lira/1014791361/reviews/?ll=43.889574%2C56.287187&tab=reviews&z=17"
         target="_blank" rel="noopener">
         Оставить отзыв в Яндекс
      </a>

      <a class="btn gis"
         href="https://2gis.ru/n_novgorod/firm/2674540559836449/tab/reviews?m=43.889507%2C56.287218%2F16"
         target="_blank" rel="noopener">
         Оставить отзыв в 2ГИС
      </a>

      <a class="btn tg"
         href="https://t.me/LIRA_NN"
         target="_blank" rel="noopener">
         Наш Telegram
      </a>
    </div>

    <div class="note">Спасибо, что помогаете нам становиться лучше.</div>
  </div>
</body>
</html>
