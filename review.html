<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Отзывы — Автоцентр Лира</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg1:#050b17;
      --bg2:#0b1b3a;
      --card:rgba(255,255,255,.06);
      --text:#ffffff;
      --muted:rgba(255,255,255,.7);
      --shadow:0 18px 50px rgba(0,0,0,.45);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: radial-gradient(900px 500px at 50% 0%, rgba(90,140,255,.22), transparent 60%),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
    }

    .wrap{
      width:min(520px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.04));
      border:1px solid rgba(255,255,255,.10);
      border-radius: 26px;
      padding:28px 22px;
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .glow{
      position:absolute;
      inset:-120px -80px auto -80px;
      height:220px;
      background: radial-gradient(closest-side, rgba(42,171,238,.22), transparent 70%);
      filter: blur(2px);
      pointer-events:none;
    }

    .logo{
      width:110px;
      height:110px;
      object-fit:contain;
      display:block;
      margin:0 auto 14px;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.35));
      animation: float 4.2s ease-in-out infinite;
    }
    @keyframes float{
      0%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
      100%{transform:translateY(0)}
    }

    h1{
      margin:6px 0 6px;
      font-size: 28px;
      line-height:1.15;
      letter-spacing:.2px;
      text-align:center;
    }
    .sub{
      margin:0 0 18px;
      text-align:center;
      color:var(--muted);
      font-size:15px;
    }

    .btns{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top:14px;
    }

    a.btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-decoration:none;
      padding:16px 16px;
      border-radius: var(--radius);
      font-weight:800;
      font-size:17px;
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 10px 22px rgba(0,0,0,.25);
      transform: translateZ(0);
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    a.btn:active{
      transform: scale(.99);
      filter: brightness(.97);
      box-shadow: 0 8px 16px rgba(0,0,0,.22);
    }

    .yandex{ background:#ffd400; color:#111; }
    .gis{ background:#28c76f; color:#fff; }
    .tg{ background:#2AABEE; color:#fff; }

    .note{
      margin-top:16px;
      text-align:center;
      color:rgba(255,255,255,.55);
      font-size:12.5px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="glow"></div>

    <!-- логотип из репозитория -->
    <img class="logo" src="logo.png" alt="Автоцентр Лира">

    <h1>Будем рады вашему отзыву</h1>
    <p class="sub">Выберите площадку</p>

    <div class="btns">
      <!-- ВАЖНО: это обычные ссылки, работают всегда -->
      <a class="btn yandex" id="btnYandex"
         href="https://yandex.ru/maps/org/lira/1014791361/reviews/?ll=43.889574%2C56.287187&tab=reviews&z=17"
         target="_blank" rel="noopener">
        Оставить отзыв в Яндекс
      </a>

      <a class="btn gis" id="btn2gis"
         href="https://2gis.ru/n_novgorod/firm/2674540559836449/tab/reviews?m=43.889507%2C56.287218%2F16"
         target="_blank" rel="noopener">
        Оставить отзыв в 2ГИС
      </a>

      <a class="btn tg" id="btnTg"
         href="https://t.me/LIRA_NN"
         target="_blank" rel="noopener">
        Наш Telegram
      </a>
    </div>

    <div class="note">Спасибо, что помогаете нам становиться лучше.</div>
  </div>

  <script>
    // === Supabase (ваши значения) ===
    const SUPABASE_URL = "https://oqgjjxsi0aofenvacetl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_tJ00AmXTERE9jKnHfSFpvQ_yVce_t4d";

    // создаём клиент (важно: supabase.createClient, без window.supabase)
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Логируем клик, но НИКОГДА не блокируем переход
    async function track(platform){
      try{
        await sb.from("review_clicks").insert({ platform });
      }catch(e){
        // игнорируем ошибки, чтобы кнопки всегда работали
        console.warn("track error:", e?.message || e);
      }
    }

    // Вешаем события на ссылки, не отменяя переход
    document.getElementById("btnYandex").addEventListener("click", () => track("yandex"));
    document.getElementById("btn2gis").addEventListener("click", () => track("2gis"));
    document.getElementById("btnTg").addEventListener("click", () => track("telegram"));
  </script>
</body>
