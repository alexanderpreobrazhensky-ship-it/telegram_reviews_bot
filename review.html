<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Отзывы — Автоцентр Лира</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg1:#050b17;
      --bg2:#0b1b3a;
      --card:rgba(255,255,255,.06);
      --stroke:rgba(255,255,255,.12);
      --text:#ffffff;
      --muted:rgba(255,255,255,.72);
      --yandex:#ffd400;
      --gis:#28c76f;
      --tg:#2AABEE;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: Arial, sans-serif;
      background: radial-gradient(1200px 700px at 20% 0%, rgba(64,126,255,.22), transparent 55%),
                  radial-gradient(900px 600px at 80% 20%, rgba(255,212,0,.12), transparent 60%),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--text);
      padding:24px;
    }

    .wrap{
      width:min(520px, 100%);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--stroke);
      border-radius:20px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      padding:26px;
      text-align:center;
      position:relative;
      overflow:hidden;
    }

    .glow{
      position:absolute;
      inset:-120px -120px auto auto;
      width:280px;
      height:280px;
      background: radial-gradient(circle at 30% 30%, rgba(64,126,255,.35), transparent 60%);
      filter: blur(10px);
      pointer-events:none;
      opacity:.9;
    }

    .logo{
      width:120px;
      height:auto;
      display:block;
      margin:0 auto 14px;
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
    }

    @keyframes float{
      0%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
      100%{transform:translateY(0)}
    }

    h1{
      margin:6px 0 6px;
      font-size:28px;
      letter-spacing:.2px;
    }

    .subtitle{
      margin:0 0 18px;
      color:var(--muted);
      font-size:15px;
      line-height:1.35;
    }

    .buttons{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top:14px;
    }

    .btn{
      padding:16px 16px;
      border-radius:14px;
      font-size:18px;
      border:none;
      cursor:pointer;
      font-weight:800;
      transition: transform .08s ease, filter .15s ease;
    }
    .btn:active{ transform: translateY(1px) scale(.995); }
    .btn:hover{ filter: brightness(1.04); }

    .yandex{ background:var(--yandex); color:#111;
